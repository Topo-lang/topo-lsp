name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOPO_CORE_REF: main
  TOPO_LANG_REF: main
  TOPO_V8_REF: main
  # topo-lang-cpp / topo-lang-rust unpinned at promotion (2026-08-16): the
  # ungated TopoCppPlugin / TopoRustPlugin aggregators ship on main now.
  TOPO_LANG_CPP_REF: main
  TOPO_LANG_RUST_REF: main
  TOPO_LANG_JAVA_REF: main
  TOPO_LANG_PYTHON_REF: main
  TOPO_LANG_TYPESCRIPT_REF: main
  # The default-scope (LLVM OFF) topo-lang-cpp / topo-lang-rust installs below
  # ship two distinct cpp/rust artifacts:
  #   - the LSP BRIDGE (TopoCppLSP / TopoRustLSP), required for the cpp/rust
  #     bridge integration tests to import, and
  #   - the PLUGIN aggregator (TopoCppPlugin / TopoRustPlugin), no longer
  #     LLVM-gated upstream, so topo-lsp-server's find_package auto-detection
  #     registers the cpp/rust plugins here too.
  # Without these installs find_package fails and the bridge tests
  # configure-skip.

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clangd rust-src \
            openjdk-17-jdk python3 python3-pip nodejs npm
          # External LSP servers — installed DETERMINISTICALLY (not best-effort):
          # the cpp/rust/python/java bridge integration tests are required to RUN
          # on Linux, not self-skip (a skipped test is not a passing test). The
          # "Assert live bridges ran" step below fails the job if any bridge
          # fully self-skips.
          # clangd: from apt above. rust-analyzer (ensure a PATH proxy exists —
          # the bridge probes `command -v rust-analyzer`):
          rustup component add rust-analyzer
          ra="$(rustup which --toolchain stable rust-analyzer 2>/dev/null || rustup which rust-analyzer 2>/dev/null || true)"
          if [ -n "${ra}" ]; then ln -sf "${ra}" "${HOME}/.cargo/bin/rust-analyzer"; fi
          command -v rust-analyzer
          # pyright ships the pyright-langserver binary the bridge probes for;
          # npm -g puts it on PATH (unlike pip --user's ~/.local/bin).
          npm i -g pyright
          # jdtls (Eclipse JDT Language Server) — no apt package; use a PINNED
          # milestone tarball (the -latest snapshot is a moving, unverifiable
          # input), verified against its published SHA-256 BEFORE extraction,
          # downloaded to an unpredictable mktemp path (not a fixed /tmp name).
          # Bump both values together; the .sha256 lives next to the tarball:
          # https://download.eclipse.org/jdtls/milestones/1.58.0/
          JDTLS_URL="https://download.eclipse.org/jdtls/milestones/1.58.0/jdt-language-server-1.58.0-202604151538.tar.gz"
          JDTLS_SHA256="2a5bbe55ec91b4325392050dc422cead3220a2459b3766be35e1fff45b4a50d9"
          jdtls_tmp="$(mktemp -d)"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "${jdtls_tmp}/jdtls.tar.gz" "${JDTLS_URL}"
          echo "${JDTLS_SHA256}  ${jdtls_tmp}/jdtls.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/jdtls"
          tar -xzf "${jdtls_tmp}/jdtls.tar.gz" -C "${HOME}/jdtls"
          rm -rf "${jdtls_tmp}"
          printf '#!/usr/bin/env bash\nexec python3 "%s/bin/jdtls" "$@"\n' "${HOME}/jdtls" \
            | sudo tee /usr/local/bin/jdtls >/dev/null
          sudo chmod +x /usr/local/bin/jdtls
          jdtls --help >/dev/null 2>&1 || echo "jdtls launcher present (probe non-zero is fine)"

      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install ninja llvm rust openjdk@17 python@3.12 node
          # brew llvm is keg-only — put clangd on PATH for the cpp bridge probe.
          echo "$(brew --prefix llvm)/bin" >> "${GITHUB_PATH}"
          # Deterministic external LSP servers (see Linux note). jdtls +
          # rust-analyzer have Homebrew formulae; pyright via npm -g.
          brew install rust-analyzer jdtls
          npm i -g pyright

      - name: Install external LSP servers (windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          # Deterministic external LSP servers (see Linux note): the bridge
          # suites are required to RUN on Windows too, not self-skip. The
          # platform spawn layer resolves bare server names on PATH including
          # .cmd/.bat launchers, so npm shims and jdtls.bat work as-is.
          # clangd: the runner image ships LLVM (clangd.exe included) at
          # C:\Program Files\LLVM, not always on PATH; install via choco only
          # if the image ever drops it.
          if [ ! -x "/c/Program Files/LLVM/bin/clangd.exe" ]; then
            choco install llvm -y --no-progress
          fi
          echo 'C:\Program Files\LLVM\bin' >> "${GITHUB_PATH}"
          # rust-analyzer: rustup component, then a real rust-analyzer.exe in
          # ~/.cargo/bin (already on PATH). Copy instead of symlink — symlink
          # creation needs elevation on Windows. Every link FAILS FAST with
          # diagnostics: the pre-fix version silently no-op'd when `rustup
          # which` came back empty (the `if [ -n ra ]` guard swallowed it),
          # the rust live cases then skipped 8/8 and the leg stayed green —
          # the exact gap tracked by the lsp windows live-bridge issue.
          rustup component add rust-analyzer
          ra="$(rustup which --toolchain stable rust-analyzer 2>/dev/null || rustup which rust-analyzer 2>/dev/null || true)"
          echo "rustup which rust-analyzer -> '${ra}'"
          if [ -z "${ra}" ]; then
            # Fallback: locate the freshly installed component binary directly
            # under the toolchain bin dirs (rustup which can come up empty
            # when the runner's toolchain aliases don't match the expected
            # names).
            ra="$(find "${HOME}/.rustup/toolchains" -path '*/bin/rust-analyzer.exe' 2>/dev/null | head -1 || true)"
            echo "toolchain-bin-glob fallback -> '${ra}'"
          fi
          if [ -z "${ra}" ]; then
            echo "::error::rust-analyzer component installed but no rust-analyzer.exe located (rustup which empty AND toolchain bin glob empty). Toolchains present:"
            ls -la "${HOME}/.rustup/toolchains" 2>&1 || true
            exit 1
          fi
          cp "$(cygpath -u "${ra}")" "${HOME}/.cargo/bin/rust-analyzer.exe"
          ls -l "${HOME}/.cargo/bin/rust-analyzer.exe"
          # ROOT CAUSE (verified 2026-08-16, binary-level): the rustup
          # rust-analyzer component is NOT a standalone exe — it statically
          # imports the toolchain's rustc_driver-<hash>.dll (verified in
          # rust-analyzer-1.97.1-x86_64-pc-windows-msvc: import table carries
          # `rustc_driver-e41b336de1bfe42c.dll`), which ships in the RUSTC
          # component's bin dir, not in the rust-analyzer-preview component
          # (whose bin/ holds only rust-analyzer.exe + .pdb). Copying the exe
          # to ~/.cargo/bin breaks the exe→DLL adjacency the Windows loader
          # relies on → STATUS_DLL_NOT_FOUND → CreateProcess fails → bash 127
          # (the linux/macos legs are green because they SYMLINK, preserving
          # the toolchain dir as the exe's own directory). That also explains
          # the 8/8 skips since the June un-gating: the copy never executed
          # on any windows runner. The ladder below installs whichever exec
          # path works as the bare-name-resolvable mechanism the suite probes:
          #   rung 1: copied exe in ~/.cargo/bin (expected to fail — see
          #           above; kept as a cheap self-check)
          #   rung 2: toolchain-original exe — rustc_driver-<hash>.dll sits
          #           next to it in the toolchain bin dir → executes. Install
          #           via PATH to the toolchain bin dir and DROP the copy (a
          #           broken copy earlier on PATH would shadow the working
          #           one).
          #   rung 3: both fail — PowerShell loader diagnostics (Win32 error
          #           text names the exact missing module) + rustup-mediated
          #           probe, then fail the step.
          # Defender exclusion kept defensively for future images where
          # realtime scanning may be on again (non-fatal).
          powershell -NoProfile -Command "Add-MpPreference -ExclusionPath \"$(cygpath -w "${HOME}/.cargo/bin")\" -ErrorAction SilentlyContinue" \
            || echo "Defender exclusion for ~/.cargo/bin not applied (non-fatal)"
          ra_msys="$(cygpath -u "${ra}")"
          ra_dir_msys="$(dirname "${ra_msys}")"
          ra_win="$(cygpath -w "${ra_msys}")"
          copy_msys="${HOME}/.cargo/bin/rust-analyzer.exe"
          copy_win="$(cygpath -w "${copy_msys}")"
          verify_exec() {
            local label="$1"; shift
            local attempt rc
            for attempt in 1 2 3; do
              if "$@" >/dev/null 2>&1; then
                echo "verify ${label}: OK (attempt ${attempt})"
                return 0
              else
                rc=$?
                echo "verify ${label}: attempt ${attempt} failed (exit ${rc}), retrying after 5s"
              fi
              sleep 5
            done
            return 1
          }
          ps_exec() {
            # PowerShell wraps a CreateProcess/loader failure with the Win32
            # error text (e.g. "The specified module could not be found
            # (0x8007007E)") — this names the missing-DLL class that bash's
            # 127 cannot. Heredoc via stdin avoids MSYS argv re-quoting.
            local label="$1" win="$2"
            powershell -NoProfile -Command - <<PS_EOF
          & '${win}' --version
          if (\$?) { exit 0 } else { Write-Host "SPAWN FAILED (${label})"; exit 1 }
          PS_EOF
          }
          if verify_exec "copied exe (absolute path)" "${copy_msys}" --version; then
            echo "MECHANISM: copied exe in ~/.cargo/bin executes"
          elif verify_exec "toolchain original exe" "${ra_msys}" --version; then
            echo "MECHANISM: toolchain-bin exe executes but the ~/.cargo/bin copy does not — installing via PATH to the toolchain bin dir and dropping the copy"
            rm -f "${copy_msys}"
            cygpath -w "${ra_dir_msys}" >> "${GITHUB_PATH}"
            export PATH="${ra_dir_msys}:${PATH}"
          else
            echo "::error::rust-analyzer.exe fails to execute from both the copy and the toolchain bin — Win32 loader diagnostics:"
            echo "--- copy integrity: sha256 of copy vs toolchain original ---"
            sha256sum "${copy_msys}" "${ra_msys}" || true
            echo "--- PowerShell exec: copy ---"
            ps_exec "copy" "${copy_win}" || echo "ps copy: exit $?"
            echo "--- PowerShell exec: toolchain original ---"
            ps_exec "original" "${ra_win}" || echo "ps original: exit $?"
            echo "--- rustup-mediated exec (toolchain env) ---"
            rustup run stable rust-analyzer --version || echo "rustup run: exit $?"
            echo "--- Defender real-time protection (known OFF on this image; kept for the record) ---"
            powershell -NoProfile -Command "Get-MpComputerStatus | Select-Object -ExpandProperty RealTimeProtectionEnabled" || true
            exit 1
          fi
          # Shared tail: the bare name must resolve and execute the same way
          # the test probe does; command -v prints the resolved path.
          verify_exec "bare name on PATH" rust-analyzer --version
          rust-analyzer --version
          command -v rust-analyzer
          # pyright ships pyright-langserver.cmd via npm -g; the runner's npm
          # global prefix is on PATH.
          npm i -g pyright
          # jdtls — same PINNED, sha256-verified milestone as the Linux step
          # (bump both together; the .sha256 lives next to the tarball):
          # https://download.eclipse.org/jdtls/milestones/1.58.0/
          JDTLS_URL="https://download.eclipse.org/jdtls/milestones/1.58.0/jdt-language-server-1.58.0-202604151538.tar.gz"
          JDTLS_SHA256="2a5bbe55ec91b4325392050dc422cead3220a2459b3766be35e1fff45b4a50d9"
          jdtls_tmp="$(mktemp -d)"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "${jdtls_tmp}/jdtls.tar.gz" "${JDTLS_URL}"
          echo "${JDTLS_SHA256}  ${jdtls_tmp}/jdtls.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/jdtls"
          tar -xzf "${jdtls_tmp}/jdtls.tar.gz" -C "${HOME}/jdtls"
          rm -rf "${jdtls_tmp}"
          # The archive ships bin/jdtls.bat (python launcher shim) — that is
          # what the bare-name `jdtls` spawn resolves. Recreate it if a future
          # archive drops it, then put bin/ on PATH (Windows-style so the
          # entry is valid for the test processes' CreateProcess resolution).
          if [ ! -f "${HOME}/jdtls/bin/jdtls.bat" ]; then
            printf '@echo off\r\npython "%%~dp0jdtls.py" %%*\r\n' > "${HOME}/jdtls/bin/jdtls.bat"
          fi
          cygpath -w "${HOME}/jdtls/bin" >> "${GITHUB_PATH}"

      # JDK 21: the pinned jdtls milestone hard-refuses anything older at
      # launch ("jdtls requires at least Java 21") — on 17 the java bridge
      # integration cases skipped/failed at spawn, so the live jdtls path
      # was never actually exercised.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      - name: Cache upstream topo install
        id: topo-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/topo-install
          # The *_REF values are literal branch names ("main"), so the -vN
          # suffix is the invalidation knob — bump it whenever the suites need
          # newer upstream bits. v6: rotate the cached prefix so the
          # default-scope topo-lang-cpp/rust installs carry the ungated plugin
          # aggregators (TopoCppPlugin / TopoRustPlugin).
          key: topo-lsp-deps-core-${{ env.TOPO_CORE_REF }}-lang-${{ env.TOPO_LANG_REF }}-v8-${{ env.TOPO_V8_REF }}-langcpp-${{ env.TOPO_LANG_CPP_REF }}-langrust-${{ env.TOPO_LANG_RUST_REF }}-langjava-${{ env.TOPO_LANG_JAVA_REF }}-langpy-${{ env.TOPO_LANG_PYTHON_REF }}-langts-${{ env.TOPO_LANG_TYPESCRIPT_REF }}-${{ matrix.os }}-v6

      - name: Build & install topo-core (zero-LLVM, lang-less)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git \
              "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_ENABLE_LLVM=OFF
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git \
              "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" \
                -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      - name: Re-install topo-core (with-lang)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install"
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-v8
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_V8_REF}" \
              https://github.com/topo-lang/topo-v8.git \
              "${RUNNER_TEMP}/topo-v8-src"
          cmake -S "${RUNNER_TEMP}/topo-v8-src" \
                -B "${RUNNER_TEMP}/topo-v8-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-v8-build" --target install

      - name: Build & install topo-lang-cpp (default scope, LLVM OFF)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_CPP_REF}" \
              https://github.com/topo-lang/topo-lang-cpp.git \
              "${RUNNER_TEMP}/topo-lang-cpp-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-cpp-src" \
                -B "${RUNNER_TEMP}/topo-lang-cpp-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_CPP_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-cpp-build" --target install

      - name: Build & install topo-lang-rust (default scope, LLVM OFF)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_RUST_REF}" \
              https://github.com/topo-lang/topo-lang-rust.git \
              "${RUNNER_TEMP}/topo-lang-rust-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-rust-src" \
                -B "${RUNNER_TEMP}/topo-lang-rust-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_RUST_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-rust-build" --target install

      - name: Build & install topo-lang-java
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_JAVA_REF}" \
              https://github.com/topo-lang/topo-lang-java.git \
              "${RUNNER_TEMP}/topo-lang-java-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-java-src" \
                -B "${RUNNER_TEMP}/topo-lang-java-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_JAVA_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-java-build" --target install

      - name: Build & install topo-lang-python
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_PYTHON_REF}" \
              https://github.com/topo-lang/topo-lang-python.git \
              "${RUNNER_TEMP}/topo-lang-python-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-python-src" \
                -B "${RUNNER_TEMP}/topo-lang-python-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_PYTHON_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-python-build" --target install

      - name: Build & install topo-lang-typescript
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_TYPESCRIPT_REF}" \
              https://github.com/topo-lang/topo-lang-typescript.git \
              "${RUNNER_TEMP}/topo-lang-typescript-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-typescript-src" \
                -B "${RUNNER_TEMP}/topo-lang-typescript-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_TYPESCRIPT_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-typescript-build" --target install

      - name: Configure topo-lsp
        run: |
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_LSP_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Assert live host-bridge round-trips ran
        # A bridge test is a single ctest entry whose internal gtest cases
        # GTEST_SKIP() when the external server is absent — so "Passed" can mean
        # "every case skipped". This step re-runs each bridge through
        # .github/scripts/assert-live-cases.sh and FAILS unless every NAMED case
        # below lands in the gtest passed set (exact-name match): a count-only
        # guard is trivially satisfied by the always-green offline cases (e.g.
        # *.InvalidPathFails, *.BridgeMalformedResponseHandled) even when ALL
        # live cases skip. Mode is lenient (aggregate skips tolerated) because
        # these suites carry skips that say nothing about server availability:
        # JdtBridge.RestartCycleIsolatesState skips unconditionally (jdtls cold
        # start, test/integration/JdtBridgeTest.cpp) and the index-deadline
        # cases (e.g. ClangdBridge.FindDefinitionOnRealSymbol) skip
        # nondeterministically — those stay OUT of the named lists; each named
        # case skips only on server-absent/start-failure. Renaming or filtering
        # out a named case turns this step red (ABSENT diagnostic) until the
        # list is updated — intended. All three OSes install the external
        # servers deterministically, so the assertion covers the whole matrix,
        # Windows included. (The 2026-08-15 windows-only narrowing to the
        # clangd set is REMOVED: the windows install step now fails fast and
        # prints diagnostics for the rust-analyzer install instead of
        # silently no-oping — the root cause, verified binary-level on
        # 2026-08-16, is that the rustup rust-analyzer component links the
        # toolchain's rustc_driver-<hash>.dll, so the ~/.cargo/bin copy
        # loses DLL adjacency and never executes (bash 127); the step now
        # installs via PATH to the toolchain bin dir where the DLL sits.
        # The rust suite is asserted on Windows again; if it still skips
        # there, the leg goes red and the skip-reason echo in
        # assert-live-cases.sh names the failing probe.)
        run: |
          fail=0
          bash .github/scripts/assert-live-cases.sh lenient topo-lsp-integration-tests \
            ClangdBridge.StartFromPathIfAvailable \
            ClangdBridge.UnknownSymbolReturnsNullopt \
            ClangdBridge.ConcurrentQueriesSameSession \
            ClangdBridge.RestartCycleIsolatesState \
            ClangdBridge.SingleArgStartOverloadAutoDetects \
            ClangdBridge.IsClangdAvailablePredicateConsistent || fail=1
          bash .github/scripts/assert-live-cases.sh lenient topo-lsp-rust-integration-tests \
            RustAnalyzerBridgeLive.StartFromPathIfAvailable \
            RustAnalyzerBridgeLive.FindDefinitionOnKnownFn \
            RustAnalyzerBridgeLive.FindReferencesOnKnownFn \
            RustAnalyzerBridgeLive.GetHoverInfoReturnsSignature \
            RustAnalyzerBridgeLive.FindTypeDefinitionOnStruct \
            RustAnalyzerBridgeLive.UnknownSymbolReturnsNullopt \
            RustAnalyzerBridgeLive.EmptyQualifiedNameReturnsNullopt \
            RustAnalyzerBridgeLifecycle.RestartCycleIsolatesState || fail=1
          bash .github/scripts/assert-live-cases.sh lenient topo-lsp-java-integration-tests \
            JdtBridge.StartFromPathIfAvailable \
            JdtBridge.FindDefinitionOnKnownMethod \
            JdtBridge.FindReferencesOnKnownMethod \
            JdtBridge.GetHoverInfoReturnsSignature \
            JdtBridge.FindTypeDefinitionOnClass \
            JdtBridge.UnknownSymbolReturnsNullopt || fail=1
          bash .github/scripts/assert-live-cases.sh lenient topo-lsp-python-integration-tests \
            PyrightBridge.StartFromPathIfAvailable \
            PyrightBridge.FindReferencesOnFunction \
            PyrightBridge.GetHoverInfoReturnsSignature \
            PyrightBridge.FindTypeDefinitionOnClass \
            PyrightBridge.UnknownSymbolReturnsNullopt || fail=1
          [ "${fail}" -eq 0 ]

      - name: Install topo-lsp
        run: cmake --install build --prefix "${RUNNER_TEMP}/lsp-install"

      - name: find_package smoke
        run: |
          mkdir -p "${RUNNER_TEMP}/find-package-smoke"
          cd "${RUNNER_TEMP}/find-package-smoke"
          cat > vcpkg.json <<'JSON'
          {
            "name": "topo-lsp-smoke",
            "version-string": "0.0.1",
            "builtin-baseline": "56bb2411609227288b70117ead2c47585ba07713",
            "dependencies": ["nlohmann-json", "tomlplusplus"]
          }
          JSON
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(topo-lsp-find-package-smoke LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(topo-lsp CONFIG REQUIRED)
          if(NOT TARGET topo::lsp::TopoLSPLib)
              message(FATAL_ERROR "topo::lsp::TopoLSPLib target was not imported")
          endif()
          if(NOT TARGET topo::lsp::topo-lsp)
              message(FATAL_ERROR "topo::lsp::topo-lsp target was not imported")
          endif()
          add_executable(smoke smoke.cpp)
          target_link_libraries(smoke PRIVATE topo::lsp::TopoLSPLib)
          target_compile_definitions(smoke PRIVATE
              TOPO_LSP_BIN="$<TARGET_FILE:topo::lsp::topo-lsp>")
          if(MINGW)
              target_link_options(smoke PRIVATE -static -static-libgcc -static-libstdc++)
          endif()
          CMAKE
          cat > smoke.cpp <<'CPP'
          #include "LSPServer.h"
          #include <cstdio>
          #include <filesystem>
          int main() {
              topo::lsp::LSPServer server;
              if (server.shouldExit()) return 1;
              if (!std::filesystem::exists(TOPO_LSP_BIN)) return 2;
              std::printf("topo-lsp find_package OK (binary=%s)\n", TOPO_LSP_BIN);
              return 0;
          }
          CPP
          cmake -S . -B build -G Ninja \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/lsp-install;${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build
          ./build/smoke
